<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matrix + Countdown + Happy Birthday</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }
    #rotateMessage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      text-align: center;
      z-index: 9999;
    }
  </style>
</head>
<body>
<audio id="bgm" src="birthday.mp3" loop></audio>
<div id="rotateMessage"> Xoay ngang và nhấn vào màn hình để thấy điều bất ngờ nhé 😉😉!!!</div>

<canvas id="matrixCanvas"></canvas>
<canvas id="particleCanvas"></canvas>

<script>
  const matrixCanvas = document.getElementById("matrixCanvas");
  const ctx = matrixCanvas.getContext("2d");
  const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const particleCanvas = document.getElementById("particleCanvas");
  const ctx2 = particleCanvas.getContext("2d");

  let columns, drops;
  let centerX, centerY;
  let particles = [];
  let showingMessage = true;
  let fontSize;

  // 🔹 Tính tỉ lệ scale dựa trên kích thước màn hình
  function getScale() {
    const baseWidth = 1280; // chuẩn cho PC
    return Math.max(0.4, Math.min(1.0, window.innerWidth / baseWidth));
  }

  function resizeCanvas() {
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;
    particleCanvas.width = window.innerWidth;
    particleCanvas.height = window.innerHeight;
    centerX = particleCanvas.width / 2;
    centerY = particleCanvas.height / 2;

    const scale = getScale();
   // tự chỉnh font matrix
    fontSize = Math.round(18 * scale); 
    setupMatrix();
  }

  function setupMatrix() {
    columns = Math.ceil(matrixCanvas.width / fontSize);
    drops = Array(columns).fill(0);
  }

  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
    ctx.fillStyle = "#ffb6c1";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const char = characters[Math.floor(Math.random() * characters.length)];
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  function createParticlesFromText(text, baseSize = 300) {
    const scale = getScale();
    const size = Math.round(baseSize * scale); // co chữ theo màn hình

    const tempCanvas = document.createElement("canvas");
    const tempCtx = tempCanvas.getContext("2d");

    tempCtx.font = `bold ${size}px sans-serif`;
    const metrics = tempCtx.measureText(text);
    const textWidth = metrics.width;
    const textHeight = size;

    tempCanvas.width = textWidth + 100;
    tempCanvas.height = textHeight + 100;

    tempCtx.fillStyle = "#87CEFA";
    tempCtx.font = `bold ${size}px sans-serif`;
    tempCtx.textAlign = "center";
    tempCtx.textBaseline = "middle";
    tempCtx.fillText(text, tempCanvas.width / 2, tempCanvas.height / 2);

    const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
    particles = [];

    const step = Math.round(4 * scale); // mật độ hạt

    for (let y = 0; y < tempCanvas.height; y += step) {
      for (let x = 0; x < tempCanvas.width; x += step) {
        const i = (y * tempCanvas.width + x) * 4;
        if (imageData[i + 3] > 128) {
          const dx = x - tempCanvas.width / 2;
          const dy = y - tempCanvas.height / 2;
          particles.push({
            x: centerX + dx,
            y: centerY + dy,
            alpha: 1,
            vx: (Math.random() - 0.5) * 1.2,
            vy: (Math.random() - 0.5) * 1.2
          });
        }
      }
    }
    showingMessage = true;
  }
// TRÁI TYM
  function createHeartShape() {
    const scale = getScale();
    particles = [];
    for (let t = 0; t < Math.PI * 2; t += 0.003) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const dx = centerX + x * 15 * scale;
      const dy = centerY - y * 15 * scale;
      particles.push({
        x: dx,
        y: dy,
        alpha: 1,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2
      });
    }
    showingMessage = true;
  }
// MÀU TRÁI TYM
  function drawParticles() {
    ctx2.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    for (const p of particles) {
      ctx2.fillStyle = `rgba(135,206,250,${p.alpha})`;
      ctx2.beginPath();
      ctx2.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx2.fill();
      p.x += p.vx;
      p.y += p.vy;
      if (!showingMessage) p.alpha -= 0.02;
    }
    if (!showingMessage) particles = particles.filter(p => p.alpha > 0);
  }

  function startCountdownAndMessages() {
    let countdown = 3;
    const countdownDelay = 2000;

    function showNextCountdown() {
      if (countdown > 0) {
        createParticlesFromText(countdown.toString(), 300);
        setTimeout(() => {
          showingMessage = false;
          const fadeInterval = setInterval(() => {
            if (particles.length === 0) {
              clearInterval(fadeInterval);
              countdown--;
              showNextCountdown();
            }
          }, 50);
        }, countdownDelay);
      } else {
        showMessages();
      }
    }

    function showMessages() {
      const texts = [
        { text: "HAPPY BIRTHDAY", size: 140, delay: 3000 },
        { text: "CÚN IUU 🐾", size: 180, delay: 3000 },
        { text: "29.10.2006", size: 220, delay: 3000 },
        { text: "MÃI XINH MÃI IUUU", size: 140, delay: 3000 }
        
      ];  
      let idx = 0;

      function showNextMessage() {
        if (idx < texts.length) {
          const entry = texts[idx];
          createParticlesFromText(entry.text, entry.size);
          setTimeout(() => {
            showingMessage = false;
            const fadeInterval = setInterval(() => {
              if (particles.length === 0) {
                clearInterval(fadeInterval);
                idx++;
                showNextMessage();
              }
            }, 50);
          }, entry.delay);
        } else {
          createHeartShape();
        }
      }

      showNextMessage();
    }

    showNextCountdown();
  }

  function initStart() {
    setInterval(drawMatrix, 40);
    setInterval(drawParticles, 30);
    setTimeout(startCountdownAndMessages, 5000);
  }

  function checkOrientation() {
    if (window.innerWidth < window.innerHeight) {
      document.getElementById("rotateMessage").style.display = "flex";
      matrixCanvas.style.display = "none";
      particleCanvas.style.display = "none";
    } else {
      document.getElementById("rotateMessage").style.display = "none";
      matrixCanvas.style.display = "block";
      particleCanvas.style.display = "block";
    }
  }

  window.addEventListener("resize", () => {
    resizeCanvas();
    checkOrientation();
  });
  window.addEventListener("orientationchange", () => {
    resizeCanvas();
    checkOrientation();
    // nhạc khi click
function enableMusic() {
  const bgm = document.getElementById("bgm");
  bgm.play().catch(() => {});
  document.removeEventListener("click", enableMusic);
}
document.addEventListener("click", enableMusic);
  });

  resizeCanvas();
  initStart();
  checkOrientation();
</script>

</body>
</html>
